services:
  frontend:
    build:
      context: ./centralperk-frontend
      secrets:
        - frontend_env
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://127.0.0.1:4000
        NEXT_PUBLIC_ENABLE_DEMO_AUTH: "true"
        NEXT_PUBLIC_FORCE_CUSTOMER_DEMO_AUTH: "false"
        NEXT_PUBLIC_USE_REMOTE_LOYALTY_API: "true"
        NEXT_PUBLIC_USE_LOCAL_LOYALTY_API: "false"
    env_file:
      - ./centralperk-frontend/.env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      GATEWAY_URL: http://gateway:4000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_GATEWAY_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_ENABLE_DEMO_AUTH: "true"
      NEXT_PUBLIC_FORCE_CUSTOMER_DEMO_AUTH: "false"
      USE_REMOTE_LOYALTY_API: "true"
      USE_LOCAL_LOYALTY_API: "false"
      NEXT_PUBLIC_USE_REMOTE_LOYALTY_API: "true"
      NEXT_PUBLIC_USE_LOCAL_LOYALTY_API: "false"
      POINTS_SERVICE_TIMEOUT_MS: "15000"
      CAMPAIGN_WRITE_TOKEN: ${CAMPAIGN_WRITE_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/admin/settings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8

  gateway:
    build:
      context: ./centralperk-backend/gateway
    environment:
      PORT: "4000"
      POINTS_ENGINE_URL: http://points-engine:4001
      CAMPAIGN_SERVICE_URL: http://campaign-service:4002
      MEMBER_SERVICE_URL: http://member-service:4003
      SEGMENT_SERVICE_URL: http://segment-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
      REWARD_SERVICE_URL: http://reward-service:4006
      BACKEND_API_URL: http://frontend:3000/api
      USE_LOCAL_LOYALTY_API: "false"
      NEXT_PUBLIC_ENABLE_DEMO_AUTH: "false"
      CAMPAIGN_WRITE_TOKEN: ${CAMPAIGN_WRITE_TOKEN:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - member-service
      - points-engine
      - campaign-service
      - segment-service
      - notification-service
      - reward-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  member-service:
    build:
      context: ./centralperk-backend/member-service
    env_file:
      - ./centralperk-frontend/.env
    environment:
      PORT: "4003"
    ports:
      - "127.0.0.1:4003:4003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  points-engine:
    build:
      context: ./centralperk-backend/points-engine
    env_file:
      - ./centralperk-frontend/.env
    environment:
      PORT: "4001"
      CAMPAIGN_SERVICE_URL: http://campaign-service:4002
      USE_LOCAL_LOYALTY_API: "false"
      NEXT_PUBLIC_ENABLE_DEMO_AUTH: "false"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  campaign-service:
    build:
      context: ./centralperk-backend/campaign-service
    env_file:
      - ./centralperk-frontend/.env
    environment:
      PORT: "4002"
      USE_LOCAL_LOYALTY_API: "false"
      NEXT_PUBLIC_ENABLE_DEMO_AUTH: "false"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "127.0.0.1:4002:4002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  segment-service:
    build:
      context: ./centralperk-backend/segment-service
    env_file:
      - ./centralperk-frontend/.env
    environment:
      PORT: "4004"
    ports:
      - "127.0.0.1:4004:4004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ./centralperk-backend/notification-service
    environment:
      PORT: "4005"
    ports:
      - "127.0.0.1:4005:4005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  reward-service:
    build:
      context: ./centralperk-backend/reward-service
    environment:
      PORT: "4006"
    ports:
      - "127.0.0.1:4006:4006"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  frontend_env:
    file: ./centralperk-frontend/.env
