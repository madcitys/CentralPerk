services:
  member-service:
    build:
      context: ./centralperk-backend/member-service
    container_name: member-service
    restart: unless-stopped
    environment:
      SCM_MEMBER_USE_SPLIT_SERVICE_DATABASES: "true"
      SCM_MEMBER_PORT: "3012"
      SCM_MEMBER_SUPABASE_URL: ${SCM_MEMBER_SUPABASE_URL:?Set SCM_MEMBER_SUPABASE_URL}
      SCM_MEMBER_SUPABASE_SERVICE_ROLE_KEY: ${SCM_MEMBER_SUPABASE_SERVICE_ROLE_KEY:?Set SCM_MEMBER_SUPABASE_SERVICE_ROLE_KEY}
      SCM_MEMBER_DATABASE_URL: ${SCM_MEMBER_DATABASE_URL:?Set SCM_MEMBER_DATABASE_URL}
      SCM_MEMBER_DB_SCHEMA: ${SCM_MEMBER_DB_SCHEMA:-public}
    ports:
      - "3012:3012"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://member-service:3012/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  segment-service:
    build:
      context: ./centralperk-backend/segment-service
    container_name: segment-service
    restart: unless-stopped
    environment:
      SCM_SEGMENT_USE_SPLIT_SERVICE_DATABASES: "true"
      SCM_SEGMENT_PORT: "3013"
      SCM_SEGMENT_SUPABASE_URL: ${SCM_SEGMENT_SUPABASE_URL:?Set SCM_SEGMENT_SUPABASE_URL}
      SCM_SEGMENT_SUPABASE_SERVICE_ROLE_KEY: ${SCM_SEGMENT_SUPABASE_SERVICE_ROLE_KEY:?Set SCM_SEGMENT_SUPABASE_SERVICE_ROLE_KEY}
      SCM_SEGMENT_DATABASE_URL: ${SCM_SEGMENT_DATABASE_URL:?Set SCM_SEGMENT_DATABASE_URL}
      SCM_SEGMENT_DB_SCHEMA: ${SCM_SEGMENT_DB_SCHEMA:-public}
      SCM_MEMBER_SERVICE_URL: http://member-service:3012
    ports:
      - "3013:3013"
    depends_on:
      member-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://segment-service:3013/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  campaign-service:
    build:
      context: ./centralperk-backend/campaign-service
    container_name: campaign-service
    restart: unless-stopped
    environment:
      SCM_CAMPAIGN_USE_SPLIT_SERVICE_DATABASES: "true"
      SCM_CAMPAIGN_PORT: "3014"
      SCM_CAMPAIGN_SUPABASE_URL: ${SCM_CAMPAIGN_SUPABASE_URL:?Set SCM_CAMPAIGN_SUPABASE_URL}
      SCM_CAMPAIGN_SUPABASE_SERVICE_ROLE_KEY: ${SCM_CAMPAIGN_SUPABASE_SERVICE_ROLE_KEY:?Set SCM_CAMPAIGN_SUPABASE_SERVICE_ROLE_KEY}
      SCM_CAMPAIGN_DATABASE_URL: ${SCM_CAMPAIGN_DATABASE_URL:?Set SCM_CAMPAIGN_DATABASE_URL}
      SCM_CAMPAIGN_DB_SCHEMA: ${SCM_CAMPAIGN_DB_SCHEMA:-public}
      SCM_MEMBER_SERVICE_URL: http://member-service:3012
    ports:
      - "3014:3014"
    depends_on:
      member-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://campaign-service:3014/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: ./centralperk-backend/notification-service
    container_name: notification-service
    restart: unless-stopped
    environment:
      SCM_NOTIFICATION_USE_SPLIT_SERVICE_DATABASES: "true"
      SCM_NOTIFICATION_PORT: "3015"
      SCM_NOTIFICATION_SUPABASE_URL: ${SCM_NOTIFICATION_SUPABASE_URL:?Set SCM_NOTIFICATION_SUPABASE_URL}
      SCM_NOTIFICATION_SUPABASE_SERVICE_ROLE_KEY: ${SCM_NOTIFICATION_SUPABASE_SERVICE_ROLE_KEY:?Set SCM_NOTIFICATION_SUPABASE_SERVICE_ROLE_KEY}
      SCM_NOTIFICATION_DATABASE_URL: ${SCM_NOTIFICATION_DATABASE_URL:?Set SCM_NOTIFICATION_DATABASE_URL}
      SCM_NOTIFICATION_DB_SCHEMA: ${SCM_NOTIFICATION_DB_SCHEMA:-public}
    ports:
      - "3015:3015"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://notification-service:3015/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  reward-service:
    build:
      context: ./centralperk-backend/reward-service
    container_name: reward-service
    restart: unless-stopped
    environment:
      SCM_REWARD_USE_SPLIT_SERVICE_DATABASES: "true"
      SCM_REWARD_PORT: "3016"
      SCM_REWARD_SUPABASE_URL: ${SCM_REWARD_SUPABASE_URL:?Set SCM_REWARD_SUPABASE_URL}
      SCM_REWARD_SUPABASE_SERVICE_ROLE_KEY: ${SCM_REWARD_SUPABASE_SERVICE_ROLE_KEY:?Set SCM_REWARD_SUPABASE_SERVICE_ROLE_KEY}
      SCM_REWARD_DATABASE_URL: ${SCM_REWARD_DATABASE_URL:?Set SCM_REWARD_DATABASE_URL}
      SCM_REWARD_DB_SCHEMA: ${SCM_REWARD_DB_SCHEMA:-public}
      SCM_POINTS_SERVICE_URL: http://points-engine:3017
    ports:
      - "3016:3016"
    depends_on:
      points-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://reward-service:3016/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  points-engine:
    build:
      context: ./centralperk-backend/points-engine
    container_name: points-engine
    restart: unless-stopped
    environment:
      SCM_POINTS_USE_SPLIT_SERVICE_DATABASES: "true"
      SCM_POINTS_PORT: "3017"
      SCM_POINTS_SUPABASE_URL: ${SCM_POINTS_SUPABASE_URL:?Set SCM_POINTS_SUPABASE_URL}
      SCM_POINTS_SUPABASE_SERVICE_ROLE_KEY: ${SCM_POINTS_SUPABASE_SERVICE_ROLE_KEY:?Set SCM_POINTS_SUPABASE_SERVICE_ROLE_KEY}
      SCM_POINTS_DATABASE_URL: ${SCM_POINTS_DATABASE_URL:?Set SCM_POINTS_DATABASE_URL}
      SCM_POINTS_DB_SCHEMA: ${SCM_POINTS_DB_SCHEMA:-public}
      SCM_MEMBER_SERVICE_URL: http://member-service:3012
      SCM_CAMPAIGN_SERVICE_URL: http://campaign-service:3014
    ports:
      - "3017:3017"
    depends_on:
      member-service:
        condition: service_healthy
      campaign-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://points-engine:3017/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ./centralperk-backend/gateway
    container_name: backend-api
    restart: unless-stopped
    environment:
      SCM_GATEWAY_PORT: "3011"
      SCM_GATEWAY_URL: http://gateway:3011
      SCM_MEMBER_SERVICE_URL: http://member-service:3012
      SCM_SEGMENT_SERVICE_URL: http://segment-service:3013
      SCM_CAMPAIGN_SERVICE_URL: http://campaign-service:3014
      SCM_NOTIFICATION_SERVICE_URL: http://notification-service:3015
      SCM_REWARD_SERVICE_URL: http://reward-service:3016
      SCM_POINTS_SERVICE_URL: http://points-engine:3017
      SCM_GATEWAY_ADMIN_ROLE: ${SCM_GATEWAY_ADMIN_ROLE:-admin}
    ports:
      - "3011:3011"
    depends_on:
      member-service:
        condition: service_healthy
      segment-service:
        condition: service_healthy
      campaign-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reward-service:
        condition: service_healthy
      points-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./centralperk-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_URL: ${NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_URL:-}
        NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_PROJECT_ID: ${NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_PROJECT_ID:-}
        NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SCM_FRONTEND_ENABLE_DEMO_AUTH: ${NEXT_PUBLIC_SCM_FRONTEND_ENABLE_DEMO_AUTH:-false}
        NEXT_PUBLIC_SCM_FRONTEND_FORCE_CUSTOMER_DEMO_AUTH: ${NEXT_PUBLIC_SCM_FRONTEND_FORCE_CUSTOMER_DEMO_AUTH:-false}
        NEXT_PUBLIC_SCM_FRONTEND_USE_SPLIT_SERVICE_DATABASES: ${NEXT_PUBLIC_SCM_FRONTEND_USE_SPLIT_SERVICE_DATABASES:-${SCM_FRONTEND_USE_SPLIT_SERVICE_DATABASES:-true}}
        NEXT_PUBLIC_SCM_GATEWAY_URL: ${NEXT_PUBLIC_SCM_GATEWAY_URL:-http://localhost:3011}
    container_name: frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SCM_FRONTEND_PORT: "3010"
      HOSTNAME: "0.0.0.0"
      SCM_GATEWAY_URL: http://gateway:3011
      NEXT_PUBLIC_SCM_GATEWAY_URL: ${NEXT_PUBLIC_SCM_GATEWAY_URL:-http://localhost:3011}
      SCM_MEMBER_SERVICE_URL: http://member-service:3012
      SCM_SEGMENT_SERVICE_URL: http://segment-service:3013
      SCM_CAMPAIGN_SERVICE_URL: http://campaign-service:3014
      SCM_NOTIFICATION_SERVICE_URL: http://notification-service:3015
      SCM_REWARD_SERVICE_URL: http://reward-service:3016
      SCM_POINTS_SERVICE_URL: http://points-engine:3017
      NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_URL: ${NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_URL:-}
      NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_PROJECT_ID: ${NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_PROJECT_ID:-}
      NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SCM_FRONTEND_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SCM_FRONTEND_ENABLE_DEMO_AUTH: ${NEXT_PUBLIC_SCM_FRONTEND_ENABLE_DEMO_AUTH:-false}
      NEXT_PUBLIC_SCM_FRONTEND_FORCE_CUSTOMER_DEMO_AUTH: ${NEXT_PUBLIC_SCM_FRONTEND_FORCE_CUSTOMER_DEMO_AUTH:-false}
      NEXT_PUBLIC_SCM_FRONTEND_USE_SPLIT_SERVICE_DATABASES: ${NEXT_PUBLIC_SCM_FRONTEND_USE_SPLIT_SERVICE_DATABASES:-${SCM_FRONTEND_USE_SPLIT_SERVICE_DATABASES:-true}}
    ports:
      - "3010:3010"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
