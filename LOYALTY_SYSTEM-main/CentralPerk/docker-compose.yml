services:
  member-service:
    build:
      context: ./services/member-service
    container_name: member-service
    environment:
      USE_SPLIT_SERVICE_DATABASES: "true"
      PORT: "4003"
      MEMBER_SUPABASE_URL: ${MEMBER_SUPABASE_URL:?Set MEMBER_SUPABASE_URL}
      MEMBER_SUPABASE_SERVICE_ROLE_KEY: ${MEMBER_SUPABASE_SERVICE_ROLE_KEY:?Set MEMBER_SUPABASE_SERVICE_ROLE_KEY}
      MEMBER_DATABASE_URL: ${MEMBER_DATABASE_URL:?Set MEMBER_DATABASE_URL}
      MEMBER_DB_SCHEMA: ${MEMBER_DB_SCHEMA:-public}
    ports:
      - "4003:4003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://member-service:4003/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  segment-service:
    build:
      context: ./services/segment-service
    container_name: segment-service
    environment:
      USE_SPLIT_SERVICE_DATABASES: "true"
      PORT: "4004"
      SEGMENT_SUPABASE_URL: ${SEGMENT_SUPABASE_URL:?Set SEGMENT_SUPABASE_URL}
      SEGMENT_SUPABASE_SERVICE_ROLE_KEY: ${SEGMENT_SUPABASE_SERVICE_ROLE_KEY:?Set SEGMENT_SUPABASE_SERVICE_ROLE_KEY}
      SEGMENT_DATABASE_URL: ${SEGMENT_DATABASE_URL:?Set SEGMENT_DATABASE_URL}
      SEGMENT_DB_SCHEMA: ${SEGMENT_DB_SCHEMA:-public}
    ports:
      - "4004:4004"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://segment-service:4004/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  campaign-service:
    build:
      context: ./services/campaign-service
    container_name: campaign-service
    environment:
      USE_SPLIT_SERVICE_DATABASES: "true"
      PORT: "4002"
      CAMPAIGN_SUPABASE_URL: ${CAMPAIGN_SUPABASE_URL:?Set CAMPAIGN_SUPABASE_URL}
      CAMPAIGN_SUPABASE_SERVICE_ROLE_KEY: ${CAMPAIGN_SUPABASE_SERVICE_ROLE_KEY:?Set CAMPAIGN_SUPABASE_SERVICE_ROLE_KEY}
      CAMPAIGN_DATABASE_URL: ${CAMPAIGN_DATABASE_URL:?Set CAMPAIGN_DATABASE_URL}
      CAMPAIGN_DB_SCHEMA: ${CAMPAIGN_DB_SCHEMA:-public}
      MEMBER_SERVICE_URL: http://member-service:4003
    ports:
      - "4002:4002"
    depends_on:
      member-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://campaign-service:4002/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: ./services/notification-service
    container_name: notification-service
    environment:
      USE_SPLIT_SERVICE_DATABASES: "true"
      PORT: "4005"
      NOTIFICATION_SUPABASE_URL: ${NOTIFICATION_SUPABASE_URL:?Set NOTIFICATION_SUPABASE_URL}
      NOTIFICATION_SUPABASE_SERVICE_ROLE_KEY: ${NOTIFICATION_SUPABASE_SERVICE_ROLE_KEY:?Set NOTIFICATION_SUPABASE_SERVICE_ROLE_KEY}
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?Set NOTIFICATION_DATABASE_URL}
      NOTIFICATION_DB_SCHEMA: ${NOTIFICATION_DB_SCHEMA:-public}
    ports:
      - "4005:4005"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://notification-service:4005/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  reward-service:
    build:
      context: ./services/reward-service
    container_name: reward-service
    environment:
      USE_SPLIT_SERVICE_DATABASES: "true"
      PORT: "4006"
      REWARD_SUPABASE_URL: ${REWARD_SUPABASE_URL:?Set REWARD_SUPABASE_URL}
      REWARD_SUPABASE_SERVICE_ROLE_KEY: ${REWARD_SUPABASE_SERVICE_ROLE_KEY:?Set REWARD_SUPABASE_SERVICE_ROLE_KEY}
      REWARD_DATABASE_URL: ${REWARD_DATABASE_URL:?Set REWARD_DATABASE_URL}
      REWARD_DB_SCHEMA: ${REWARD_DB_SCHEMA:-public}
      POINTS_SERVICE_URL: http://points-engine:4001
    ports:
      - "4006:4006"
    depends_on:
      points-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://reward-service:4006/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  points-engine:
    build:
      context: ./services/points-engine
    container_name: points-engine
    environment:
      USE_SPLIT_SERVICE_DATABASES: "true"
      PORT: "4001"
      POINTS_SUPABASE_URL: ${POINTS_SUPABASE_URL:?Set POINTS_SUPABASE_URL}
      POINTS_SUPABASE_SERVICE_ROLE_KEY: ${POINTS_SUPABASE_SERVICE_ROLE_KEY:?Set POINTS_SUPABASE_SERVICE_ROLE_KEY}
      POINTS_DATABASE_URL: ${POINTS_DATABASE_URL:?Set POINTS_DATABASE_URL}
      POINTS_DB_SCHEMA: ${POINTS_DB_SCHEMA:-public}
      MEMBER_SERVICE_URL: http://member-service:4003
      CAMPAIGN_SERVICE_URL: http://campaign-service:4002
    ports:
      - "4001:4001"
    depends_on:
      member-service:
        condition: service_healthy
      campaign-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://points-engine:4001/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ./services/gateway
    container_name: backend-api
    environment:
      PORT: "4000"
      GATEWAY_URL: http://gateway:4000
      MEMBER_SERVICE_URL: http://member-service:4003
      SEGMENT_SERVICE_URL: http://segment-service:4004
      CAMPAIGN_SERVICE_URL: http://campaign-service:4002
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
      REWARD_SERVICE_URL: http://reward-service:4006
      POINTS_SERVICE_URL: http://points-engine:4001
      ADMIN_ROLE: ${ADMIN_ROLE:-admin}
    ports:
      - "4000:4000"
    depends_on:
      member-service:
        condition: service_healthy
      segment-service:
        condition: service_healthy
      campaign-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reward-service:
        condition: service_healthy
      points-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PROJECT_ID: ${NEXT_PUBLIC_SUPABASE_PROJECT_ID:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_ENABLE_DEMO_AUTH: ${NEXT_PUBLIC_ENABLE_DEMO_AUTH:-true}
        NEXT_PUBLIC_FORCE_CUSTOMER_DEMO_AUTH: ${NEXT_PUBLIC_FORCE_CUSTOMER_DEMO_AUTH:-false}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:4000}
    container_name: frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      GATEWAY_URL: http://gateway:4000
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:4000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PROJECT_ID: ${NEXT_PUBLIC_SUPABASE_PROJECT_ID:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_ENABLE_DEMO_AUTH: ${NEXT_PUBLIC_ENABLE_DEMO_AUTH:-true}
      NEXT_PUBLIC_FORCE_CUSTOMER_DEMO_AUTH: ${NEXT_PUBLIC_FORCE_CUSTOMER_DEMO_AUTH:-false}
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
