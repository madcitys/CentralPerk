name: Loyalty Backend CI

on:
  push:
    paths:
      - "src/backend/**"
      - ".github/workflows/loyalty-backend.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/loyalty-backend.yml"

jobs:
  loyalty-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/backend/package-lock.json
            src/backend/gateway/package-lock.json
            src/backend/points-engine/package-lock.json
            src/backend/campaign-service/package-lock.json

      - name: Install backend services
        run: npm install && npm run setup:backend

      - name: Build backend split
        run: npm run build:backend && npm run build:services

      - name: Run points coverage tests
        run: npm run test:points

      - name: Run campaign coverage tests
        run: npm run test:campaigns

      - name: Validate Docker Compose
        run: npm run compose:config
