name: Loyalty Frontend CI

on:
  push:
    paths:
      - "src/frontend/**"
      - ".github/workflows/loyalty-frontend.yml"
      - ".github/workflows/master-pipeline-fe.yml"
  pull_request:
    paths:
      - "src/frontend/**"
      - ".github/workflows/loyalty-frontend.yml"
      - ".github/workflows/master-pipeline-fe.yml"

jobs:
  loyalty-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Verify frontend handoff package
        run: node scripts/verify-loyalty-frontend.mjs

      - name: Run consumer contract tests
        run: npm run test:contracts

      - name: Build frontend
        run: npm run build
